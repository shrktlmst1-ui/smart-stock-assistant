# Render Blueprint — Smart Stock Assistant (single Web Service)
# Backend API + Flutter Web UI served from the same origin.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-stock-assistant
    runtime: python
    rootDir: backend
    buildCommand: bash render_build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MARKET_PULSE_ENABLED
        value: "false"
      - key: MARKET_PULSE_FIXTURE_MODE
        value: "false"
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "480"
      - key: AUTH_RATE_LIMIT
        value: "5"
      - key: AUTH_RATE_WINDOW_SECONDS
        value: "60"
      - key: CORS_ORIGINS
        value: https://smart-stock-assistant-web.onrender.com,https://smart-stock-assistant.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      - key: MASSIVE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: APP_PASSWORD
        value: "SmartStock2026!"
      - key: APP_JWT_SECRET
        generateValue: true

  - type: web
    name: smart-stock-assistant-web
    runtime: static
    rootDir: app
    buildCommand: bash render_build.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
